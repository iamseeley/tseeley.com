[package]
name = "tseeley"
version = "0.1.0"
edition = "2024"

[features]
default = ["serve"]
serve = ["dep:axum", "dep:notify", "dep:tokio", "dep:tokio-stream"]

[dependencies]
atom_syndication = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jotdown = "0.10.0"
lightningcss = "1.0.0-alpha.71"
maud = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-fancy", "html"] }
toml = "1.1.2"

# `serve`-only deps. Gated behind the `serve` feature so production
# build-only binaries don't pull them in.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"], optional = true }
notify = { version = "8.2.0", optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["rt", "fs", "net", "sync", "time"], optional = true }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"], optional = true }
