name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c zola build
      - name: rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          nix develop -c rsync -rlz --delete-after --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id -o IdentitiesOnly=yes" \
            public/ deploy@${{ secrets.HOST }}:
